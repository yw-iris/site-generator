/* ============ 解析：约定式 Markdown → 内容模型 ============ */
function splitTitle(t){
  for(const s of ['·','｜','|','//']){
    if(t.includes(s)){
      const i=t.lastIndexOf(s);
      return {zh:t.slice(0,i).trim(), en:t.slice(i+s.length).trim()};
    }
  }
  return {zh:t, en:''};
}
function parseMarkdown(text){
  const lines = text.replace(/\r\n/g,'\n').split('\n');
  const m = {cover:{title:'',subtitle:'',signature:'',heroImage:''}, intro:'', sections:[], links:[], by:''};
  let cur=null, inCover=true;
  for(const raw of lines){
    const line = raw;
    if(/^#\s+/.test(line)){ m.cover.title=line.replace(/^#\s+/,'').trim(); inCover=true; continue; }
    if(/^##\s+/.test(line)){
      inCover=false;
      const {zh,en}=splitTitle(line.replace(/^##\s+/,'').trim());
      cur={zh,en,blocks:[]}; m.sections.push(cur); continue;
    }
    if(inCover){
      if(/^副标题[:：]/.test(line)){ m.cover.subtitle=line.replace(/^副标题[:：]/,'').trim(); continue; }
      if(/^署名[:：]/.test(line)){ m.cover.signature=line.replace(/^署名[:：]/,'').trim(); continue; }
      if(/^封面图[:：]/.test(line)){ m.cover.heroImage=line.replace(/^封面图[:：]/,'').trim(); continue; }
      if(/^>\s?/.test(line)){ m.intro += line.replace(/^>\s?/,'').trim()+'\n'; continue; }
      if(line.trim()) m.intro += line.trim()+'\n';
      continue;
    }
    if(!cur) continue;
    if(/^[-*]\s+/.test(line)){
      let l=cur.blocks.find(b=>b.type==='list'&&!b.ordered);
      if(!l){ l={type:'list',ordered:false,items:[]}; cur.blocks.push(l); }
      l.items.push(line.replace(/^[-*]\s+/,'').trim()); continue;
    }
    if(/^\d+\.\s+/.test(line)){
      let l=cur.blocks.find(b=>b.type==='list'&&b.ordered);
      if(!l){ l={type:'list',ordered:true,items:[]}; cur.blocks.push(l); }
      l.items.push(line.replace(/^\d+\.\s+/,'').trim()); continue;
    }
    if(/^!\[.*\]\(.*\)/.test(line)){
      const mm=line.match(/^!\[(.*)\]\((.*)\)/);
      cur.blocks.push({type:'image',alt:mm[1],src:mm[2]}); continue;
    }
    if(/^made by/i.test(line)){ m.by=line.trim(); continue; }
    const linkAll=[...line.matchAll(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g)];
    if(linkAll.length){
      const stripped=line.replace(/\[[^\]]*\]\(https?:\/\/[^)]*\)/g,'').replace(/[：:\s>]/g,'');
      if(stripped.length<=8){ linkAll.forEach(mm=>m.links.push({text:mm[1],href:mm[2]})); continue; }
    }
    if(line.trim()==='') continue;
    cur.blocks.push({type:'p',text:line.trim()});
  }
  m.intro=m.intro.trim();
  return m;
}

/* ============ 富文本 / Word → Markdown ============ */
function inlineToMd(node){
  let s='';
  node.childNodes.forEach(n=>{
    if(n.nodeType===3) s+=n.textContent;
    else if(n.nodeName==='A') s+=`[${n.textContent}](${n.getAttribute('href')||''})`;
    else if(n.nodeName==='IMG') s+=`![${(n.getAttribute('alt')||'')}](${n.getAttribute('src')||''})`;
    else s+=n.textContent;
  });
  return s;
}
function htmlToMarkdown(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  let out='';
  doc.body.childNodes.forEach(node=>{
    const nm=node.nodeName;
    if(nm==='H1') out+='# '+node.textContent+'\n';
    else if(nm==='H2') out+='## '+node.textContent+'\n';
    else if(nm==='P') out+=inlineToMd(node)+'\n';
    else if(nm==='UL') out+=[...node.querySelectorAll('li')].map(li=>'- '+inlineToMd(li)).join('\n')+'\n';
    else if(nm==='OL') out+=[...node.querySelectorAll('li')].map((li,i)=>(i+1)+'. '+inlineToMd(li)).join('\n')+'\n';
    else if(nm==='IMG') out+=`![${(node.getAttribute('alt')||'')}](${node.getAttribute('src')||''})\n`;
  });
  return out.trim();
}

/* ============ 渲染：内容模型 + 主题 → 完整 HTML ============ */
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function inlineRich(s){
  s=escapeHtml(s);
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b.type==='p') return `<p>${inlineRich(b.text)}</p>`;
    if(b.type==='image') return `<figure><img src="${escapeHtml(b.src)}" alt="${escapeHtml(b.alt)}"></figure>`;
    if(b.type==='list'){
      const tag=b.ordered?'ol':'ul';
      return `<${tag}>`+b.items.map(i=>`<li>${inlineRich(i)}</li>`).join('')+`</${tag}>`;
    }
    return '';
  }).join('\n');
}
function renderLinks(links){
  if(!links.length) return '';
  return `<div class="links">`+links.map(l=>`<a href="${escapeHtml(l.href)}" target="_blank" rel="noopener">${escapeHtml(l.text)}</a>`).join('')+`</div>`;
}

function renderSite(model, themeKey){
  const css = THEMES[themeKey] || THEMES.dark;
  const hasMask = (themeKey==='dark'||themeKey==='terminal');
  const c = model.cover;
  const maskBg = (hasMask && c.heroImage) ? `style="background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),url('${escapeHtml(c.heroImage)}') center/cover"` : '';
  const mask = hasMask ? `
<div class="cover-mask" id="mask" ${maskBg}>
  <h1>${escapeHtml(c.title)}</h1>
  ${c.subtitle?`<div class="sub">${escapeHtml(c.subtitle)}</div>`:''}
  <div class="enter">▷ 点击任意处进入</div>
</div>` : '';
  const hero = (!hasMask && c.heroImage) ? `<img class="hero" src="${escapeHtml(c.heroImage)}" alt="">` : '';
  const coverTop = (!hasMask) ? `<div class="cover"><h1>${escapeHtml(c.title)}</h1>${c.subtitle?`<div class="sub">${escapeHtml(c.subtitle)}</div>`:''}${c.signature?`<div class="sig">${escapeHtml(c.signature)}</div>`:''}</div>` : '';
  const sections = model.sections.map(s=>`
<section class="block">
  <div class="zh">${escapeHtml(s.zh)}</div>
  ${s.en?`<div class="en">${escapeHtml(s.en)}</div>`:''}
  ${renderBlocks(s.blocks)}
</section>`).join('\n');
  const byHtml = model.by ? `<div class="by">${inlineRich(model.by.replace(/made by/i,'made by '))}</div>` : '';
  const revealJs = `
const blocks=document.querySelectorAll('section.block');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');e.target.classList.remove('pre');io.unobserve(e.target);}}),{threshold:.12});
blocks.forEach(function(s){
  var r=s.getBoundingClientRect();
  if(r.top<window.innerHeight*0.92){s.classList.add('in');}
  else{s.classList.add('pre');io.observe(s);}
});`;
  const script = hasMask ? `<script>
document.getElementById('mask').addEventListener('click',function(){this.classList.add('hide');document.getElementById('content').scrollIntoView({behavior:'smooth'});});
${revealJs}
<\/script>` : `<script>
${revealJs}
<\/script>`;
  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHtml(c.title||'人设站')}</title>
<style>${css}</style>
</head>
<body>
${mask}
${coverTop}
<div id="content">
  ${hero}
  ${model.intro?`<div class="intro">${escapeHtml(model.intro)}</div>`:''}
  ${sections}
  ${renderLinks(model.links)}
  <div class="outro">— ${escapeHtml(c.signature||c.title)} —</div>
  ${byHtml}
</div>
${script}
</body>
</html>`;
}

/* ============ UI 绑定 ============ */
const editor=document.getElementById('editor');
const preview=document.getElementById('preview');
const themeSel=document.getElementById('themeSel');
const sampleSel=document.getElementById('sampleSel');
const toast=document.getElementById('toast');
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200);}
function render(){
  const html=renderSite(parseMarkdown(editor.value), themeSel.value);
  preview.srcdoc=html;
  preview.dataset.html=html;
}
editor.addEventListener('input', render);
themeSel.addEventListener('change', render);
sampleSel.addEventListener('change', ()=>{ if(sampleSel.value){ editor.value=SAMPLES[sampleSel.value]; render(); } });
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const html=preview.dataset.html||renderSite(parseMarkdown(editor.value), themeSel.value);
  const blob=new Blob([html],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='site.html';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('已导出 site.html（可直接放 GitHub Pages）');
});
document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', async e=>{
  const file=e.target.files[0];
  if(!file) return;
  if(typeof mammoth==='undefined'){ showToast('Mammoth 未加载，请检查网络后重试'); return; }
  try{
    const ab=await file.arrayBuffer();
    const r=await mammoth.convertToHtml({arrayBuffer:ab});
    editor.value=htmlToMarkdown(r.value);
    render();
    showToast('Word 导入成功，已转为文档结构');
  }catch(err){ showToast('解析失败：'+err.message); }
});

/* 初始示例 */
editor.value=SAMPLES.binglian;
render();
</script>
